workflows:
  ios-build:
    name: iOS Build (No Code Sign)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      vars:
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
          cd ios && pod install && cd ..
      - name: Build iOS IPA
        script: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qr ../../../VeneraX_no_codesign.ipa Payload
          cd ../../..
    artifacts:
      - VeneraX_no_codesign.ipa
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
