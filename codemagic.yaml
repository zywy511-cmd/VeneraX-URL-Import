workflows:
  ios-build:
    name: iOS Build (No Code Sign)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: 3.24.0
      xcode: latest
      vars:
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: "-"
    scripts:
      - name: Set up fake development team
        script: |
          # 绕过Flutter签名检查，设置一个假的Development Team
          sed -i '' 's/DEVELOPMENT_TEAM = "";/DEVELOPMENT_TEAM = "AAAAAAAAAA";/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = "AAAAAAAAAA";/g' ios/Runner.xcodeproj/project.pbxproj
          
      - name: Install dependencies
        script: |
          flutter pub get
          cd ios && pod install && cd ..
          
      - name: Build iOS IPA
        script: |
          flutter build ios --release --no-codesign
          
          # 手动创建IPA
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qr ../../../VeneraX_no_codesign.ipa Payload
          cd ../../..
          
    artifacts:
      - VeneraX_no_codesign.ipa
      
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
