workflows:
  ios-build:
    name: iOS Build (No Code Sign)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: 3.41.4
      xcode: latest
      vars:
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
          cd ios && pod install && cd ..
          
      - name: Build iOS with xcodebuild (bypass Flutter signature check)
        script: |
          # 直接用xcodebuild构建，绕过Flutter的签名检查
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            -derivedDataPath build/ios_derived \
            -quiet
          
          # 找到.app文件
          APP_PATH=$(find build/ios_derived -name "Runner.app" -type d | head -1)
          echo "App found at: $APP_PATH"
          
          # 创建IPA
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr VeneraX_no_codesign.ipa Payload
          rm -rf Payload
          
          echo "IPA created successfully"
          ls -lh VeneraX_no_codesign.ipa
          
    artifacts:
      - VeneraX_no_codesign.ipa
      
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
