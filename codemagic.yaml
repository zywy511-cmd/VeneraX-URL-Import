workflows:
  ios-build:
    name: iOS Build (No Code Sign)
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      flutter: 3.41.4
      xcode: latest
      vars:
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
    scripts:
      - name: Install Rust toolchain
        script: |
          echo "=== Installing Rust ==="
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios
          rustup target add x86_64-apple-ios
          rustc --version
          cargo --version
          echo "=== Rust installed ==="
          
      - name: Install dependencies
        script: |
          source "$HOME/.cargo/env"
          flutter pub get
          cd ios && pod install && cd ..
          
      - name: Build iOS with xcodebuild
        script: |
          set -e
          source "$HOME/.cargo/env"
          
          echo "=== Starting xcodebuild ==="
          
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            -derivedDataPath build/ios_derived
          
          echo "=== xcodebuild finished ==="
          
          # 查找.app文件
          APP_PATH=$(find build/ios_derived -name "Runner.app" -type d | head -1)
          
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Runner.app not found!"
            find build/ios_derived -name "*.app" -type d
            exit 1
          fi
          
          echo "App found at: $APP_PATH"
          echo "App size: $(du -sh "$APP_PATH" | cut -f1)"
          
          # 创建IPA
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr VeneraX_no_codesign.ipa Payload
          rm -rf Payload
          
          echo "IPA created successfully"
          echo "IPA size: $(du -sh VeneraX_no_codesign.ipa | cut -f1)"
          
    artifacts:
      - VeneraX_no_codesign.ipa
      
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
