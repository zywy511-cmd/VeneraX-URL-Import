// 修复：自动安装 Rust 并设置 PATH
def rustBinDir = new File(System.getProperty("user.home"), ".cargo/bin")
def rustupBin = new File(rustBinDir, "rustup")

if (!rustupBin.exists()) {
    println "Rust not found, installing..."
    def installCmd = [
        "bash", "-c",
        "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal"
    ]
    def proc = installCmd.execute()
    proc.waitForProcessOutput(System.out, System.err)
    if (proc.exitValue() != 0) {
        println "Rust installation failed with exit code: ${proc.exitValue()}"
    } else {
        println "Rust installed successfully"
    }
}

// 设置 PATH 环境变量（通过反射）
if (rustBinDir.exists()) {
    def rustBin = rustBinDir.absolutePath
    def currentPath = System.getenv("PATH") ?: ""
    if (!currentPath.contains(rustBin)) {
        try {
            def env = System.getenv()
            // 尝试不同的反射方式
            try {
                def field = env.getClass().getDeclaredField("m")
                field.setAccessible(true)
                def map = field.get(env)
                map.put("PATH", rustBin + ":" + currentPath)
            } catch (NoSuchFieldException e1) {
                try {
                    def field = env.getClass().getDeclaredField("theUnmodifiableEnvironment")
                    field.setAccessible(true)
                    def unmodifiableEnv = field.get(null)
                    def mField = unmodifiableEnv.getClass().getDeclaredField("m")
                    mField.setAccessible(true)
                    def map = mField.get(unmodifiableEnv)
                    map.put("PATH", rustBin + ":" + currentPath)
                } catch (Exception e2) {
                    println "PATH reflection method 2 failed: ${e2.message}"
                }
            }
            println "Rust PATH added: ${rustBin}"
        } catch (Exception e) {
            println "PATH fix failed: ${e.message}"
        }
    }
}

// 安装 Android targets
if (rustupBin.exists()) {
    println "Installing Android Rust targets..."
    def targetCmd = [
        rustupBin.absolutePath,
        "target", "add",
        "aarch64-linux-android",
        "armv7-linux-androideabi",
        "x86_64-linux-android"
    ]
    def proc = targetCmd.execute()
    proc.waitForProcessOutput(System.out, System.err)
    if (proc.exitValue() != 0) {
        println "Rust target installation failed with exit code: ${proc.exitValue()}"
    } else {
        println "Rust Android targets installed successfully"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
